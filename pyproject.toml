[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codememory"
version = "0.1.0"
description = "Memory atomization protocol — AI memory as dependency-resolvable atomic units"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
code = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.22",
    "tree-sitter-javascript>=0.22",
    "tree-sitter-typescript>=0.22",
    "tree-sitter-go>=0.22",
    "tree-sitter-rust>=0.22",
    "tree-sitter-java>=0.22",
]

[project.scripts]
codememory = "codememory.cli:main"
codememory-mcp = "codememory.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["codememory", "harnesslib", "llm_gateway"]

[tool.setuptools.package-data]
codememory = ["py.typed"]
